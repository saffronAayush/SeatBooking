services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seatforge
      POSTGRES_USER: seatforge
      POSTGRES_PASSWORD: seatforge
    ports:
      - '5432:5432'
    volumes:
      - seatforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seatforge -d seatforge']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://seatforge:seatforge@postgres:5432/seatforge?schema=public
      JWT_ACCESS_SECRET: local-docker-access-secret-change-before-deploying
      JWT_REFRESH_SECRET: local-docker-refresh-secret-change-before-deploying
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_DAYS: 30
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  seatforge-postgres:
