services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seatforge
      POSTGRES_USER: seatforge
      POSTGRES_PASSWORD: seatforge
    ports:
      - '5432:5432'
    volumes:
      - seatforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seatforge -d seatforge']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: seatforge
      RABBITMQ_DEFAULT_PASS: seatforge
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - seatforge-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: production
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://seatforge:seatforge@postgres:5432/seatforge?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: production
    command: ['node', 'dist/main.js']
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://seatforge:seatforge@postgres:5432/seatforge?schema=public
      JWT_ACCESS_SECRET: local-docker-access-secret-change-before-deploying
      JWT_REFRESH_SECRET: local-docker-refresh-secret-change-before-deploying
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_DAYS: 30
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      target: production
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://seatforge:seatforge@postgres:5432/seatforge?schema=public
      RABBITMQ_URL: amqp://seatforge:seatforge@rabbitmq:5672?heartbeat=10
      HOLD_EXPIRY_INTERVAL_MS: 5000
      RECONCILIATION_INTERVAL_MS: 30000
      WORKER_PREFETCH: 10
      WORKER_BATCH_SIZE: 50
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started

volumes:
  seatforge-postgres:
  seatforge-rabbitmq:
