worker_processes auto;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  log_format structured escape=json '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method","status":$status,"duration":$request_time,"upstream":"$upstream_addr"}';
  access_log /var/log/nginx/access.log structured;
  upstream api {
    zone api 64k;
    least_conn;
    server api:3000 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
  }
  server {
    listen 80;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = /health/live { access_log off; return 200 'ok'; }
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      # Never retry a write after it has been sent to an API.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
