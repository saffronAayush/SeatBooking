global:
  scrape_interval: 15s
  scrape_timeout: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: seatforge-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9464
        refresh_interval: 10s
  - job_name: seatforge-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9464
        refresh_interval: 10s
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
